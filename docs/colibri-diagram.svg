<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, sans-serif">
  <rect width="900" height="520" rx="14" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">The Colibri Principle — 511 GB MoE on one DGX Spark</text>
  <text x="450" y="60" text-anchor="middle" fill="#8b949e" font-size="14">Keep the dense core hot · stream the 6 active experts per layer from NVMe</text>

  <!-- Left: dense core box -->
  <rect x="40" y="90" width="240" height="240" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="160" y="115" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="600">DENSE CORE — resident</text>
  <text x="160" y="137" text-anchor="middle" fill="#8b949e" font-size="12">RAM / VRAM (~9.4 GB)</text>
  <g font-size="12" fill="#c9d1d9">
    <text x="60" y="168">40 × attention (MLA + KV-compress)</text>
    <text x="60" y="190">shared experts · norms · head</text>
    <text x="60" y="212">engram (layers 1, 14)</text>
    <text x="60" y="234">DSPark/MTP (layers 37–39)</text>
  </g>
  <rect x="60" y="252" width="200" height="28" rx="6" fill="#1f6feb" opacity="0.25"/>
  <text x="160" y="271" text-anchor="middle" fill="#58a6ff" font-size="12">used EVERY token, EVERY layer</text>

  <!-- Middle: NVMe box -->
  <rect x="330" y="90" width="240" height="240" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" fill="#f0883e" font-size="15" font-weight="600">NVMe — expert weights</text>
  <text x="450" y="137" text-anchor="middle" fill="#8b949e" font-size="12">48 shards · 476 GiB · fp4</text>
  <g font-size="12" fill="#c9d1d9">
    <text x="350" y="168">384 + 1 routed experts / layer</text>
    <text x="350" y="190">~17.7 MB per expert (fp4)</text>
    <text x="350" y="212">6 active per token per layer</text>
    <text x="350" y="234">~4.5 GB read per token</text>
  </g>
  <rect x="350" y="252" width="200" height="28" rx="6" fill="#f0883e" opacity="0.25"/>
  <text x="450" y="271" text-anchor="middle" fill="#f0883e" font-size="12">random pread · LRU/FIFO cache</text>

  <!-- Right: gate box -->
  <rect x="620" y="90" width="240" height="240" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="740" y="115" text-anchor="middle" fill="#3fb950" font-size="15" font-weight="600">ROUTER — per token</text>
  <text x="740" y="137" text-anchor="middle" fill="#8b949e" font-size="12">BF16 gate (resident)</text>
  <g font-size="12" fill="#c9d1d9">
    <text x="640" y="168">selects the 6 active experts</text>
    <text x="640" y="190">for each of the 40 layers</text>
    <text x="640" y="212">sqrtsoftplus routing</text>
    <text x="640" y="234">98.5% of experts idle</text>
  </g>
  <rect x="640" y="252" width="200" height="28" rx="6" fill="#3fb950" opacity="0.25"/>
  <text x="740" y="271" text-anchor="middle" fill="#3fb950" font-size="12">only ~1.5% needed per token</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <line x1="282" y1="180" x2="326" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="328" y1="300" x2="284" y2="300" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="574" y1="180" x2="616" y2="180" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="300" x2="330" y2="300" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Labels on arrows -->
  <text x="290" y="172" fill="#8b949e" font-size="11">per token</text>
  <text x="292" y="318" fill="#8b949e" font-size="11">dequant → GEMV</text>
  <text x="586" y="172" fill="#8b949e" font-size="11">expert ids</text>

  <!-- Bottom: results strip -->
  <rect x="40" y="360" width="820" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="388" fill="#e6edf3" font-size="14" font-weight="600">Measured on GB10 (one node, 121 GB unified)</text>
  <g font-size="13">
    <rect x="60" y="402" width="180" height="58" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="150" y="425" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700">~0.02 tok/s</text>
    <text x="150" y="447" text-anchor="middle" fill="#8b949e" font-size="11">CPU-numpy (now)</text>
    <rect x="255" y="402" width="180" height="58" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="345" y="425" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">~10 tok/s</text>
    <text x="345" y="447" text-anchor="middle" fill="#8b949e" font-size="11">GPU projection</text>
    <rect x="450" y="402" width="180" height="58" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="540" y="425" text-anchor="middle" fill="#58a6ff" font-size="16" font-weight="700">1–3 tok/s</text>
    <text x="540" y="447" text-anchor="middle" fill="#8b949e" font-size="11">NVMe physical floor</text>
    <rect x="645" y="402" width="200" height="58" rx="8" fill="#1f6feb" opacity="0.15" stroke="#58a6ff"/>
    <text x="745" y="425" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="700">identity ≤ 2.46e-06</text>
    <text x="745" y="447" text-anchor="middle" fill="#8b949e" font-size="11">GPU vs CPU correctness</text>
  </g>

  <!-- Footer -->
  <text x="450" y="505" text-anchor="middle" fill="#484f58" font-size="12">github.com/ronnystevens-cmd/colibri-gx10 · Flitsken / Digital Ark</text>
</svg>
